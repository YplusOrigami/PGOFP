seed: 0
run_name: null
output_dir: outputs/runs
device: cuda
resume: null
resume_mode: episode_restart
train:
  num_envs: 1
  total_env_steps: 30000
  learning_starts: 5000
  utd_ratio: 1.0
  batch_size: 256
  warmup_source: uniform_action
  max_grad_norm: 10.0
  actor_update_interval: 1
  log_interval: 1000
  sync_device_timing: false
replay:
  capacity: 1000000
network:
  actor_hidden:
  - 256
  - 256
  - 256
  critic_hidden:
  - 256
  - 256
  - 256
  time_embed_dim: 32
  time_max_freq: 4.0
  actor_activation: silu
  critic_activation: relu
  layer_norm: false
optimizer:
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha_lr: 0.0003
algorithm:
  name: prior_flame_m
  gamma: 0.99
  target_tau: 0.005
  K_train: 32
  K_local: 16
  sigma_local: 0.3
  K_exec: 1
  K_eval: 1
  actor_objective: reverse_qrmf
  use_entropy: true
  zt_proposal: standard_normal
  source_scope:
  - behavior
  - actor
  - target
  atanh_eps: 0.001
  flow:
    time_delta: 0.02
    flow_ratio: 0.5
    time_sampling: uniform
    logit_mean: -0.4
    logit_std: 1.0
  temperature:
    mode: fixed
    alpha: 0.1
    target_entropy: auto
    alpha_min: 0.001
    alpha_max: 10.0
  density:
    method: continuous_inverse_proxy
    steps: 5
    solver: heun
    trace: hutchinson
    n_trace_samples: 1
    chunk_size: 8192
    grid:
    - 0.0
    - 0.5
    - 1.0
    logdet: full
  params: {}
  forces: {}
  inherits: null
env:
  name: inverted_double_pendulum
  id: InvertedDoublePendulum-v5
  backend: mujoco
  kwargs: {}
  normalize_obs: true
  obs_clip: 10.0
  reward_scale: 1.0
  controllers:
  - cem_mpc
  - ppo
  notes: Two passive hinges and one actuated cart; public velocities clipped to [-10,10].
prior:
  type: ppo
  controller_config: null
  controller: {}
  artifact_path: /inspire/hdd/project/fdu-weilong/public/PGOFP/artifacts/priors/mujoco_prior_beta_30k_v1/inverted_double_pendulum_ppo_seed100/stage_1000000
  distribution: native
  components: []
  fallback: gaussian
  model_access: observation_model
  cache_in_replay: true
source:
  kind: prior_mixture
  schedule: constant
  beta: 0.0
  sigma_prior: 0.3
  sigma_base: 1.0
  sigma_min: 0.05
  sigma_max: 2.0
  std_multiplier: 1.0
  total_steps: 1000000
  beta_start: 0.0
  beta_end: 0.75
  sigma_start: 1.0
  sigma_end: 0.3
  points: []
  max_delta: 0.0
condition:
  mode: public_state
  use_reference: true
  use_phase: true
  use_controller_features: false
  source_features: auto
  reference_scale: 1.0
logging:
  jsonl: true
  tensorboard: true
  flush_every: 1
  wandb:
    mode: disabled
    project: pgofp-inverted_double_pendulum-30k
    entity: ypluss
    group: mujoco_prior_beta_30k_v1__inverted_double_pendulum__ppo__beta0
    tags: []
    upload_artifacts: false
    require_online: false
    scalar_source: direct
  histogram_interval: 0
  video_interval: 0
  console_progress: true
eval:
  interval: 10000
  episodes: 10
  seed_base: 10000
  max_steps: null
  condition_bank_size: 0
  representative_action: true
  prior_before_training: true
checkpoint:
  interval: 10000
  save_replay: true
  best_metric: eval/return_mean
tags:
- mujoco_prior_beta_30k_v1
- budget30k
- ppo
- beta_sweep
notes: ''
smoke: false
