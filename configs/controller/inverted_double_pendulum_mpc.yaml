# Parallelizes the population dimension of each CEM rollout across CPU threads (see
# RolloutPlanner/CEMMPC). Pure perf knob: verified bit-identical actions vs nthread=1 at
# nthread in {1,2,4,8}. Benchmark (single plan() call, this horizon/population/iterations):
# nthread=1 -> ~92ms, 2 -> ~58ms, 4 -> ~40ms, 8 -> ~37ms (diminishing past 4).
nthread: 4
