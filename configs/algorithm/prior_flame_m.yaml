name: prior_flame_m
gamma: 0.99
target_tau: 0.005
K_train: 32
# K_local>0 adds MIS-corrected local candidates around current-policy samples (same target, far lower variance at large t).
# K_local: 0 reproduces the pure reverse-kernel estimator of the spec; it is kept as ablation `pure_reverse_kernel_K_local0`.
K_local: 16
sigma_local: 0.3
K_exec: 1
K_eval: 1
actor_objective: reverse_qrmf
use_entropy: true
zt_proposal: standard_normal
source_scope: [behavior, actor, target]
atanh_eps: 0.001
flow:
  time_delta: 0.02
  flow_ratio: 0.5
  time_sampling: uniform
temperature:
  mode: fixed
  alpha: 0.1
  target_entropy: auto
density:
  method: continuous_inverse_proxy
  steps: 5
  solver: heun
  trace: hutchinson
  n_trace_samples: 1
