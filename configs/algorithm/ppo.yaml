# PPO (prior制备 and classic comparison). Own entry points: scripts/train_prior.py / baselines.
name: ppo
gamma: 0.99
params:
  rollout_steps: 2048
  gae_lambda: 0.95
  clip_ratio: 0.2
  epochs: 10
  minibatch_size: 64
  value_coef: 0.5
  entropy_coef: 0.0
  lr: 3.0e-4
  max_grad_norm: 0.5
  hidden: [64, 64]
  total_steps: 1000000
  normalize_obs: true
  normalize_advantage: true
