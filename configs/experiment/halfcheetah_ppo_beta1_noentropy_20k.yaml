# Diagnostic: remove entropy ONLY from the soft Critic target; keep Actor Q temperature=0.1.
# 20k steps exceeds all reproducible original failures (7,345 / 10,490 / 13,632).
matrix:
  name: halfcheetah_ppo_beta1_noentropy_20k
  seeds: [0, 1, 2]
  base_overrides:
    - env=half_cheetah
    - algorithm=prior_flame_m
    - prior=ppo
    - prior.distribution=native
    - prior.artifact_path=/Volumes/T7/projects/PGOFP/artifacts/priors/half_cheetah_ppo_seed100/stage_1000000
    - source=constant
    - source.beta=1.0
    - algorithm.use_entropy=false
    - logging=local
    - logging.flush_every=1
    - "tags=[diagnostic,beta1,no_critic_entropy,budget20k]"
    - train.total_env_steps=20000
    - eval.interval=10000
    - eval.episodes=10
    - checkpoint.interval=50000
  variants:
    - {name: ppo_prior_beta1_no_critic_entropy, overrides: []}
