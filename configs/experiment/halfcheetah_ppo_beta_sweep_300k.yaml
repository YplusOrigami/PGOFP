# EXPLORATORY beta sweep. beta=0 (gaussian_flame) and beta=0.75 (ppo_prior_native) already exist from
# halfcheetah_gaussian_300k / halfcheetah_ppo_prior_300k with IDENTICAL settings; this adds beta=0.25 and 0.5.
# Same frozen prior (half_cheetah_ppo_seed100/stage_1000000, native pre-tanh mu/log_std), same budget/seeds/project.
matrix:
  name: halfcheetah_ppo_beta_sweep_300k
  seeds: [0, 1, 2]
  base_overrides:
    - env=half_cheetah
    - algorithm=prior_flame_m
    - prior=ppo
    - prior.distribution=native
    - prior.artifact_path=/Volumes/T7/projects/PGOFP/artifacts/priors/half_cheetah_ppo_seed100/stage_1000000
    - source=constant
    - logging=wandb_online
    - logging.wandb.entity=ypluss
    - logging.wandb.project=pgofp-half_cheetah-exploratory
    - logging.wandb.upload_artifacts=false
    - "tags=[exploratory,budget300k,ppo_prior_good,beta_sweep]"
    - train.total_env_steps=300000
    - eval.interval=10000
    - eval.episodes=10
    - checkpoint.interval=50000
  variants:
    - {name: ppo_prior_beta0.25, overrides: [source.beta=0.25]}
    - {name: ppo_prior_beta0.5, overrides: [source.beta=0.5]}
